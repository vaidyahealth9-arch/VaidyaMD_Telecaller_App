name: Build & Deploy Telecaller Android App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      deploy_to_bucket:
        description: 'Upload APK to Google Cloud Storage Bucket'
        required: true
        default: true
        type: boolean

jobs:
  build-and-deploy:
    name: Build & Deploy Telecaller APK
    runs-on: ubuntu-latest

    # Select GitHub environment to access environment-scoped secrets (like GCP_CREDENTIALS)
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Environment & Build Settings
        id: env-resolver
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          DEPLOY="${{ github.event.inputs.deploy_to_bucket }}"

          echo "Target Environment: $TARGET_ENV"
          echo "Build Type: $BUILD_TYPE"
          echo "Deploy to Bucket: $DEPLOY"

          # Capitalize flavor name for Gradle task: Dev or Prod
          if [ "$TARGET_ENV" = "prod" ]; then
            FLAVOR="Prod"
            BUCKET_NAME="vaidya-hms-prod-uploads"
          else
            FLAVOR="Dev"
            BUCKET_NAME="vaidya-hms-dev-uploads"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            TASK="assemble${FLAVOR}Debug"
          else
            TASK="assemble${FLAVOR}Release"
          fi

          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "gradle_task=$TASK" >> "$GITHUB_OUTPUT"
          echo "deploy_to_bucket=$DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Keystore (if secret provided)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
            echo "keystore_path=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No custom keystore provided. Debug/unsigned release will be generated."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK with Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle ${{ steps.env-resolver.outputs.gradle_task }} --stacktrace

      - name: Locate Built APK
        id: locate-apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file was generated!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$(basename "$APK_FILE")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaidyamd-telecaller-${{ steps.env-resolver.outputs.target_env }}-apk
          path: ${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 30

      - name: Authenticate to Google Cloud
        if: steps.env-resolver.outputs.deploy_to_bucket == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        if: steps.env-resolver.outputs.deploy_to_bucket == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy APK to Cloud Storage Bucket
        if: steps.env-resolver.outputs.deploy_to_bucket == 'true'
        run: |
          BUCKET="gs://${{ steps.env-resolver.outputs.bucket_name }}/apps"
          LOCAL_APK="${{ steps.locate-apk.outputs.apk_path }}"
          TARGET_ENV="${{ steps.env-resolver.outputs.target_env }}"

          echo "Uploading $LOCAL_APK to $BUCKET/vaidyamd-telecaller.apk ..."

          # 1. Upload canonical unversioned APK (used by QR scanner & /api/crm/app/download)
          gcloud storage cp "$LOCAL_APK" "$BUCKET/vaidyamd-telecaller.apk" \
            --cache-control="no-cache, no-store, must-revalidate"

          # 2. Upload timestamped backup for rollbacks
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          gcloud storage cp "$LOCAL_APK" "$BUCKET/vaidyamd-telecaller-${TARGET_ENV}-${TIMESTAMP}.apk"

          # 3. Make the apps directory publicly accessible for Android downloads
          gcloud storage objects add-iam-policy-binding "$BUCKET/vaidyamd-telecaller.apk" \
            --member=allUsers \
            --role=roles/storage.objectViewer || true

          PUBLIC_URL="https://storage.googleapis.com/${{ steps.env-resolver.outputs.bucket_name }}/apps/vaidyamd-telecaller.apk"

          echo "### 🚀 Telecaller Companion App Deployed Successfully!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${TARGET_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **GCS Bucket** | \`$BUCKET\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Public Download URL** | [$PUBLIC_URL]($PUBLIC_URL) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Users can scan the QR code in VaidyaMD CRM or open the link directly on their Android phone." >> "$GITHUB_STEP_SUMMARY"
